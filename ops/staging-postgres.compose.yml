services:
  postgres:
    image: postgres:18-alpine
    container_name: yearn-data-staging-postgres
    restart: unless-stopped
    ports:
      - 127.0.0.1:55435:5432
    env_file:
      - ${YEARN_STAGING_ENV_FILE:-../data/local-postgres.env}
    volumes:
      - staging:/var/lib/postgresql
    mem_limit: 1536m
volumes:
  staging:
    external: true
    name: yearn-data-staging-postgres
